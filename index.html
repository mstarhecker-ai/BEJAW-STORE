<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEJAW STORE</title>
<style>
:root{
  --bg:#050f0a;
  --bg2:#08180f;
  --card:#0c2416;
  --card-hover:#123a24;
  --accent:#1de9b6;
  --accent2:#00d97e;
  --text:#ffffff;
  --text-dim:rgba(255,255,255,0.62);
  --border:rgba(29,233,182,0.25);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:radial-gradient(ellipse at top left,#0a2216 0%,#050f0a 60%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  height:100vh;overflow:hidden;display:flex;letter-spacing:0.3px;
}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:300px;flex-shrink:0;padding:36px 0 20px 40px;
  display:flex;flex-direction:column;gap:14px;
  border-right:1px solid rgba(29,233,182,0.08);
  background:linear-gradient(180deg,rgba(8,24,15,0.6),transparent);
  transition:all .25s ease;
}
.sidebar.hidden{width:0;padding:0;opacity:0;pointer-events:none}
.logo{
  font-size:26px;font-weight:800;letter-spacing:2px;
  color:var(--accent);text-shadow:0 0 24px rgba(29,233,182,0.55);
  margin-bottom:8px;
}
.logo span{color:#fff;font-weight:300}
.tagline{font-size:11px;color:var(--text-dim);margin-bottom:24px;letter-spacing:3px;text-transform:uppercase}
.nav-btn{
  background:transparent;border:none;color:var(--text-dim);
  padding:10px 0;font-size:19px;font-weight:400;text-align:left;
  cursor:pointer;transition:color .2s;outline:none;
}
.nav-btn:hover{color:#fff}
.nav-btn.active{
  color:#fff;font-weight:700;background:rgba(29,233,182,0.12);
  padding-left:14px;margin-left:-14px;border-radius:6px;
  border-left:3px solid var(--accent);
}
.divider{width:80%;height:1px;background:rgba(255,255,255,0.1);margin:14px 0}

/* ---------- MAIN ---------- */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.topbar{
  display:flex;gap:24px;padding:30px 48px 12px 48px;align-items:center;
  z-index:5;
}
.ip-group{margin-left:auto;display:flex;align-items:center;gap:10px}
.ip-group label{font-size:12px;color:var(--text-dim);letter-spacing:2px}
.ip-input{
  background:rgba(29,233,182,0.08);border:1px solid var(--border);
  color:#fff;padding:8px 12px;font-size:14px;outline:none;
  width:140px;text-align:center;border-radius:4px;
}
.ip-save{
  background:var(--accent2);border:none;color:#04170e;
  padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;
  border-radius:4px;letter-spacing:1px;
}
.ip-save:hover{background:var(--accent)}
.search-trigger{
  background:rgba(255,255,255,0.06);border:1px solid var(--border);
  border-radius:4px;color:#fff;padding:8px 16px;font-size:14px;
  cursor:pointer;width:200px;text-align:left;outline:none;
}
.cart-btn{
  color:#fff;font-size:14px;font-weight:500;cursor:pointer;opacity:0.85;
}
.cart-btn:hover{opacity:1;color:var(--accent)}

/* ---------- HOME / FEATURED ---------- */
.view{flex:1;overflow-y:auto;padding:20px 48px 40px 48px;display:none}
.view.active{display:block}
.featured-title{
  font-size:38px;font-weight:300;text-transform:uppercase;
  letter-spacing:4px;color:var(--text-dim);margin-bottom:20px;
}
.featured-grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  grid-auto-rows:200px;gap:20px;
}
.feat-card{
  background:var(--card);border:2px solid transparent;
  position:relative;overflow:hidden;cursor:pointer;outline:none;
  border-radius:8px;transition:all .2s;
}
.feat-card:hover,.feat-card:focus{
  border-color:var(--accent);transform:translateY(-3px);
  box-shadow:0 12px 32px rgba(29,233,182,0.18);
}
.feat-card.big{grid-column:span 2;grid-row:span 2}
.feat-card img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.feat-overlay{
  position:absolute;bottom:0;left:0;width:100%;padding:14px 16px;
  background:linear-gradient(to top,rgba(0,0,0,0.95),transparent);
}
.feat-name{font-size:17px;font-weight:700;line-height:1.2}
.feat-sub{font-size:11px;color:var(--text-dim);margin-top:2px;letter-spacing:1px}
.feat-card.big .feat-name{font-size:24px}

/* ---------- CATEGORY GRID ---------- */
.cat-header{font-size:36px;font-weight:300;text-transform:uppercase;letter-spacing:3px;margin-bottom:14px}
.filter-bar{
  display:flex;justify-content:space-between;padding:12px 4px;
  border-top:1px solid rgba(255,255,255,0.1);
  border-bottom:1px solid rgba(255,255,255,0.1);
  font-size:14px;color:var(--text-dim);margin-bottom:22px;
}
.grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:18px;
}
.gcard{
  background:var(--card);border:2px solid transparent;border-radius:8px;
  display:flex;height:130px;cursor:pointer;outline:none;overflow:hidden;
  transition:all .2s;
}
.gcard:hover,.gcard:focus{border-color:var(--accent);background:var(--card-hover)}
.gcover{width:130px;flex-shrink:0;background:#04170e;display:flex;align-items:center;justify-content:center}
.gcover img{width:100%;height:100%;object-fit:cover}
.ginfo{flex:1;padding:14px 16px;display:flex;flex-direction:column;justify-content:center;gap:4px;overflow:hidden}
.gname{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gmeta{font-size:11px;color:var(--text-dim);letter-spacing:1px}
.gsize{font-size:11px;color:var(--accent);font-weight:600;margin-top:4px}
.region-badge{
  display:inline-block;font-size:9px;padding:2px 6px;border-radius:3px;
  background:rgba(29,233,182,0.2);color:var(--accent);letter-spacing:1px;
  margin-left:6px;
}

/* ---------- SEARCH ---------- */
.search-view{display:none;flex:1;padding:20px 48px;gap:30px}
.search-view.active{display:flex}
.search-left{width:45%;display:flex;flex-direction:column;gap:18px}
.search-input-wrap{
  display:flex;align-items:center;background:rgba(29,233,182,0.08);
  border:2px solid var(--border);padding:12px 18px;border-radius:8px;
}
.search-input{background:transparent;border:none;color:#fff;font-size:20px;outline:none;width:100%}
.kbd{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.key{
  background:rgba(255,255,255,0.06);border:1px solid transparent;color:#fff;
  font-size:15px;font-weight:600;padding:11px 0;cursor:pointer;border-radius:4px;
}
.key:hover,.key:focus{background:var(--accent2);color:#04170e}
.key.wide{grid-column:span 3}
.search-right{width:55%;overflow-y:auto;padding-right:8px}
.search-count{font-size:13px;color:var(--text-dim);margin-bottom:14px}
.sresult{
  background:var(--card);border:2px solid transparent;border-radius:6px;
  display:flex;height:110px;margin-bottom:10px;cursor:pointer;overflow:hidden;
}
.sresult:hover,.sresult:focus{border-color:var(--accent)}
.sresult .gcover{width:110px}
.sresult .gname{font-size:14px}

/* ---------- CINEMATIC ---------- */
.cinematic{
  display:none;position:fixed;inset:0;background:#000;z-index:1000;
}
.cinematic.active{display:block}
.cin-iframe{position:absolute;inset:0;width:100%;height:100%;border:none;z-index:1}
.cin-gradient{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(to right,rgba(0,0,0,0.9) 0%,rgba(0,0,0,0.4) 40%,transparent 70%),
             linear-gradient(to top,rgba(0,0,0,0.95) 0%,transparent 60%);
}
.cin-ui{
  position:absolute;inset:0;z-index:3;padding:36px 56px;
  display:flex;flex-direction:column;
}
.cin-close{
  background:transparent;border:none;color:var(--text-dim);font-size:15px;
  cursor:pointer;align-self:flex-start;padding:6px 0;letter-spacing:1px;
}
.cin-close:hover{color:#fff}
.cin-body{flex:1;display:flex;align-items:flex-end;gap:50px;justify-content:space-between}
.cin-left{width:540px;display:flex;flex-direction:column;gap:14px}
.cin-meta{
  font-size:13px;color:var(--accent);letter-spacing:2px;font-weight:700;
  border-left:3px solid var(--accent);padding-left:12px;text-transform:uppercase;
}
.cin-title{font-size:44px;font-weight:800;line-height:1.1;text-transform:uppercase;text-shadow:0 4px 20px rgba(0,0,0,0.8)}
.cin-actions{display:flex;gap:14px;margin-top:10px}
.btn-install,.btn-trailer{
  border:2px solid var(--accent);padding:14px 42px;font-size:15px;
  font-weight:700;cursor:pointer;border-radius:30px;letter-spacing:1px;
  text-transform:uppercase;transition:all .2s;outline:none;
}
.btn-install{background:var(--accent);color:#04170e}
.btn-install:hover,.btn-install:focus{background:transparent;color:var(--accent)}
.btn-trailer{background:transparent;color:#fff;border-color:#fff}
.btn-trailer:hover,.btn-trailer:focus{background:#fff;color:#000}
.cin-right{
  width:420px;background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.2);
  border-radius:18px;padding:22px 26px;
}
.cin-right h4{font-size:13px;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.cin-right p{font-size:14px;line-height:1.55;color:rgba(255,255,255,0.9);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- STATUS ---------- */
.status{
  display:none;position:fixed;top:36px;right:36px;z-index:9999;
  background:#04170e;border-left:5px solid var(--accent);
  padding:18px 26px;border-radius:6px;font-size:14px;max-width:340px;
}

/* ---------- SCROLL ---------- */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:rgba(29,233,182,0.25);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <div class="logo">BEJAW <span>STORE</span></div>
  <div class="tagline">PS4 PKG LIBRARY</div>
  <button class="nav-btn active" id="btn-home" onclick="showHome()">Featured</button>
  <div class="divider"></div>
  <button class="nav-btn" onclick="filterGenre('TODOS',this)">All Games</button>
  <button class="nav-btn" onclick="filterGenre('ACCIÓN',this)">Action</button>
  <button class="nav-btn" onclick="filterGenre('AVENTURA',this)">Adventure</button>
  <button class="nav-btn" onclick="filterGenre('RPG',this)">RPG</button>
  <button class="nav-btn" onclick="filterGenre('TERROR',this)">Horror</button>
  <button class="nav-btn" onclick="filterGenre('DEPORTES',this)">Sports</button>
  <button class="nav-btn" onclick="filterGenre('ESTRATEGIA',this)">Strategy</button>
  <div class="divider"></div>
  <div style="font-size:11px;color:var(--text-dim);letter-spacing:2px;margin-top:auto">
    <span id="total-count">0</span> GAMES LOADED
  </div>
</div>

<div class="main">
  <div class="topbar">
    <div class="ip-group">
      <label>PS4 IP</label>
      <input type="text" class="ip-input" id="ip-input" placeholder="192.168.1.x">
      <button class="ip-save" onclick="saveIP()">SAVE</button>
    </div>
    <button class="search-trigger" onclick="showSearch()">SEARCH...</button>
    <div class="cart-btn" onclick="window.location.href='https://github.com/NOVAPSNew/Ps4prueba01/releases/download/v1.0.0/Nova_RPI.pkg';">CART</div>
  </div>

  <div class="view active" id="view-home">
    <div class="featured-title">Featured</div>
    <div class="featured-grid" id="featured-grid"></div>
  </div>

  <div class="view" id="view-category">
    <div class="cat-header" id="cat-title">All Games</div>
    <div class="filter-bar">
      <div>Filter ▾</div>
      <div>Sort ▾</div>
    </div>
    <div class="grid" id="game-grid"></div>
  </div>

  <div class="search-view" id="view-search">
    <div class="search-left">
      <div class="search-input-wrap">
        <input type="text" class="search-input" id="search-field" placeholder="Type game name..." oninput="debounceSearch()">
      </div>
      <div class="kbd" id="kbd"></div>
    </div>
    <div class="search-right">
      <div class="search-count" id="search-count">Results (0)</div>
      <div id="search-results"></div>
    </div>
  </div>
</div>

<div class="cinematic" id="cinematic">
  <iframe class="cin-iframe" id="cin-iframe" allow="autoplay; encrypted-media"></iframe>
  <div class="cin-gradient"></div>
  <div class="cin-ui">
    <button class="cin-close" onclick="closeCinematic()">◀ BACK</button>
    <div class="cin-body">
      <div class="cin-left">
        <div class="cin-meta" id="cin-meta">GAME | PS4</div>
        <h2 class="cin-title" id="cin-title">Loading...</h2>
        <div class="cin-actions">
          <button class="btn-install" id="btn-install">INSTALL</button>
          <button class="btn-trailer" id="btn-trailer">TRAILER</button>
        </div>
      </div>
      <div class="cin-right">
        <h4 id="cin-size">Free</h4>
        <p id="cin-synopsis">Loading synopsis...</p>
      </div>
    </div>
  </div>
</div>

<div class="status" id="status"></div>

<script>
const CATALOG_URL = 'GAMES.json';
let ALL = [];
let FILTERED = [];
let CURRENT_GENRE = 'TODOS';
let RENDERED = 0;
const PER_PAGE = 40;
let searchTimer = null;

// ---------- GENRE ASSIGNMENT ----------
function assignGenre(name){
  const t = name.toUpperCase();
  if(/FIFA|PES |FOOTBALL|NBA|WWE|DIRT|RALLY|GRAN TURISMO|NEED FOR SPEED|F1 |MOTO/.test(t)) return 'DEPORTES';
  if(/ELDEN RING|SOULS|BLOODBORNE|WITCHER|FINAL FANTASY|MONSTER HUNTER|PERSONA/.test(t)) return 'RPG';
  if(/RESIDENT EVIL|OUTLAST|SILENT HILL|AMNESIA|TERROR|HORROR|EVIL WITHIN|CALLISTO/.test(t)) return 'TERROR';
  if(/ASSASSIN|BATTLEFIELD|CALL OF DUTY|GTA|GRAND THEFT|GOD OF WAR|SPIDER|BATMAN|CREED/.test(t)) return 'ACCIÓN';
  if(/MINECRAFT|CRASH|LEGO|FALL FLAT|SHORT HIKE|HAT IN TIME|JOURNEY|DETROIT/.test(t)) return 'AVENTURA';
  return 'ESTRATEGIA';
}

// ---------- LOAD CATALOG ----------
async function loadCatalog(){
  try{
    const res = await fetch(CATALOG_URL + '?t=' + Date.now());
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const base = data.DATA || data;
    ALL = Object.keys(base).map(url => {
      const it = base[url];
      if(!it || typeof it !== 'object' || !url.startsWith('http')) return null;
      return {
        name: it.name || 'Unknown',
        cover: it.cover_url || '',
        url: url.trim(),
        genre: it.genre || assignGenre(it.name || ''),
        trailer: it.trailer_url || '',
        synopsis: it.synopsis || 'No synopsis available.',
        title_id: it.title_id || '',
        region: it.region || '',
        version: it.version || '',
        size: it.size || 0,
        size_gb: ((it.size || 0) / 1073741824).toFixed(2)
      };
    }).filter(Boolean);
    document.getElementById('total-count').textContent = ALL.length;
    renderFeatured();
    FILTERED = [...ALL];
    renderNextPage();
  }catch(e){
    document.getElementById('featured-grid').innerHTML =
      '<div style="grid-column:1/-1;padding:40px;color:#ff6b6b;text-align:center">Failed to load GAMES.json — ' + e.message + '</div>';
  }
}

// ---------- FEATURED ----------
function renderFeatured(){
  const grid = document.getElementById('featured-grid');
  grid.innerHTML = '';
  if(ALL.length === 0) return;
  const shuffled = [...ALL].sort(() => Math.random() - 0.5).slice(0, 6);
  shuffled.forEach((g, i) => {
    const card = document.createElement('div');
    card.className = 'feat-card' + (i === 0 ? ' big' : '');
    card.tabIndex = 0;
    const img = g.cover ? `<img src="${g.cover}" loading="lazy">` : '';
    card.innerHTML = `${img}
      <div class="feat-overlay">
        <div class="feat-name">${g.name}</div>
        <div class="feat-sub">${g.region} • ${g.size_gb} GB</div>
      </div>`;
    card.onclick = () => openDetails(g);
    card.onkeydown = e => { if(e.key === 'Enter') openDetails(g); };
    grid.appendChild(card);
  });
}

// ---------- CATEGORY ----------
function showHome(){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-home').classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-home').classList.add('active');
}

function filterGenre(genre, el){
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  if(el) el.classList.add('active');
  CURRENT_GENRE = genre;
  document.getElementById('cat-title').textContent = genre === 'TODOS' ? 'All Games' : genre;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-category').classList.add('active');
  FILTERED = genre === 'TODOS' ? [...ALL] : ALL.filter(g => g.genre === genre);
  RENDERED = 0;
  document.getElementById('game-grid').innerHTML = '';
  renderNextPage();
}

function renderNextPage(){
  const grid = document.getElementById('game-grid');
  const chunk = FILTERED.slice(RENDERED, RENDERED + PER_PAGE);
  if(RENDERED === 0 && chunk.length === 0){
    grid.innerHTML = '<div style="grid-column:1/-1;padding:40px;opacity:0.5;text-align:center">No games in this category.</div>';
    return;
  }
  chunk.forEach(g => {
    const d = document.createElement('div');
    d.className = 'gcard';
    d.tabIndex = 0;
    const img = g.cover
      ? `<img src="${g.cover}" loading="lazy" onerror="this.style.display='none'">`
      : `<div style="font-size:30px;opacity:0.4">🎮</div>`;
    d.innerHTML = `
      <div class="gcover">${img}</div>
      <div class="ginfo">
        <div class="gname">${g.name}</div>
        <div class="gmeta">${g.title_id}<span class="region-badge">${g.region}</span></div>
        <div class="gsize">${g.size_gb} GB • v${g.version}</div>
      </div>`;
    d.onclick = () => openDetails(g);
    d.onkeydown = e => { if(e.key === 'Enter') openDetails(g); };
    grid.appendChild(d);
  });
  RENDERED += chunk.length;
}

document.getElementById('view-category').addEventListener('scroll', function(){
  if(this.scrollTop + this.clientHeight >= this.scrollHeight - 400){
    renderNextPage();
  }
}, {passive:true});

// ---------- SEARCH ----------
function buildKeyboard(){
  const kbd = document.getElementById('kbd');
  const keys = '1234567890QWERTYUIOPASDFGHJKLÑZXCVBNM'.split('');
  keys.forEach(k => {
    const b = document.createElement('button');
    b.className = 'key';
    b.textContent = k;
    b.onclick = () => pressKey(k);
    kbd.appendChild(b);
  });
  const del = document.createElement('button');
  del.className = 'key wide';
  del.textContent = 'DEL';
  del.onclick = () => pressKey('BACK');
  kbd.appendChild(del);

  const space = document.createElement('button');
  space.className = 'key';
  space.style.gridColumn = 'span 4';
  space.textContent = 'Space';
  space.onclick = () => pressKey(' ');
  kbd.appendChild(space);

  const done = document.createElement('button');
  done.className = 'key wide';
  done.textContent = 'Done';
  done.onclick = showHome;
  kbd.appendChild(done);
}

function pressKey(k){
  const f = document.getElementById('search-field');
  if(k === 'BACK') f.value = f.value.slice(0, -1);
  else f.value += k;
  debounceSearch();
}

function debounceSearch(){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 220);
}

function runSearch(){
  const q = document.getElementById('search-field').value.toLowerCase().trim();
  const out = document.getElementById('search-results');
  const cnt = document.getElementById('search-count');
  out.innerHTML = '';
  if(!q){ cnt.textContent = 'Results (0)'; return; }
  const matches = ALL.filter(g => g.name.toLowerCase().includes(q));
  cnt.textContent = `Results (${matches.length})`;
  matches.slice(0, 100).forEach(g => {
    const d = document.createElement('div');
    d.className = 'sresult';
    d.tabIndex = 0;
    const img = g.cover ? `<img src="${g.cover}" loading="lazy">` : '';
    d.innerHTML = `
      <div class="gcover">${img}</div>
      <div class="ginfo">
        <div class="gname">${g.name}</div>
        <div class="gmeta">${g.title_id} • ${g.region}</div>
        <div class="gsize">${g.size_gb} GB</div>
      </div>`;
    d.onclick = () => openDetails(g);
    d.onkeydown = e => { if(e.key === 'Enter') openDetails(g); };
    out.appendChild(d);
  });
}

function showSearch(){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-search').classList.add('active');
  document.getElementById('sidebar').classList.add('hidden');
  document.getElementById('search-field').focus();
  runSearch();
}

// ---------- CINEMATIC ----------
let currentGame = null;
function openDetails(g){
  currentGame = g;
  document.getElementById('cin-title').textContent = g.name;
  document.getElementById('cin-meta').textContent = `${g.genre} | ${g.title_id} | ${g.region}`;
  document.getElementById('cin-synopsis').textContent = g.synopsis;
  document.getElementById('cin-size').textContent = `${g.size_gb} GB — Free`;

  const iframe = document.getElementById('cin-iframe');
  if(g.trailer && g.trailer.includes('watch?v=')){
    let vid = g.trailer.split('v=')[1];
    if(vid && vid.includes('&')) vid = vid.split('&')[0];
    iframe.src = `https://www.youtube.com/embed/${vid}?autoplay=1&mute=1&loop=1&playlist=${vid}&controls=0&showinfo=0&rel=0`;
  } else {
    iframe.src = '';
  }

  document.getElementById('btn-install').onclick = () => installGame(g);
  document.getElementById('cinematic').classList.add('active');
}

function closeCinematic(){
  document.getElementById('cinematic').classList.remove('active');
  document.getElementById('cin-iframe').src = '';
}

// ---------- IP COOKIE ----------
function setCookie(name, val, days){
  const d = new Date();
  d.setTime(d.getTime() + days * 86400000);
  document.cookie = `${name}=${val};expires=${d.toUTCString()};path=/`;
}
function getCookie(name){
  const m = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
  return m ? m[2] : '';
}
function saveIP(){
  const v = document.getElementById('ip-input').value.trim();
  if(/^(\d{1,3}\.){3}\d{1,3}$/.test(v)){
    setCookie('PS4IP', v, 365);
    showStatus('<b>IP SAVED</b><br>' + v, true);
  } else {
    showStatus('<b>Invalid IP</b><br>Use format 192.168.1.x', false);
  }
}

// ---------- INSTALL (NOVA STORE PROXY BACKEND METHOD) ----------
async function installGame(g){
  const ip = getCookie('PS4IP') || document.getElementById('ip-input').value.trim();
  if(!ip){
    showStatus('<b>No IP set</b><br>Enter your PS4 IP first.', false);
    return;
  }

  let url = g.url.trim().replace(/[\r\n\t]/g, '');
  if(url.toLowerCase().startsWith('https://')) url = 'http://' + url.slice(8);
  else if(!url.toLowerCase().startsWith('http://')) url = 'http://' + url;
  const encoded = encodeURI(url).replace(/\[/g, '\%5B').replace(/\]/g, '%5D');

  showStatus('<b>Sending to PS4...</b>', true);

  try {
    const response = await fetch('/api/install-ps4', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ip: ip, pkgUrl: encoded })
    });

    const resData = await response.json();
    if(resData.success){
      showStatus('<b>Command Sent!</b><br>Check PS4 Notifications.', true);
      setTimeout(closeCinematic, 1500);
    } else {
      showStatus('<b>Failed to send</b><br>' + (resData.message || ''), false);
    }
  } catch (e) {
    showStatus('<b>Server Proxy Error</b><br>Check backend server.', false);
  }
}

// ---------- STATUS ----------
function showStatus(html, ok){
  const s = document.getElementById('status');
  s.innerHTML = html;
  s.style.display = 'block';
  s.style.borderLeftColor = ok ? '#1de9b6' : '#ff6b6b';
  setTimeout(() => s.style.display = 'none', 4000);
}

// ---------- INIT ----------
window.addEventListener('load', () => {
  buildKeyboard();
  const saved = getCookie('PS4IP');
  if(saved) document.getElementById('ip-input').value = saved;
  loadCatalog();
});
</script>
